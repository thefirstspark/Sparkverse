  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The First Spark - Book Cover</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: #1a1a2e;
      font-family: Georgia, serif;
    }
    
    .book-cover {
      width: 600px;
      height: 900px;
      background: linear-gradient(180deg, 
        #0a0a12 0%, 
        #0d0d1a 20%,
        #1a1a2e 40%,
        #2d1b4e 70%,
        #4a1a6b 100%
      );
      position: relative;
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(0,0,0,0.8);
    }
    
    /* Starfield */
    .stars {
      position: absolute;
      width: 100%;
      height: 100%;
      background-image: 
        radial-gradient(2px 2px at 20px 30px, white, transparent),
        radial-gradient(2px 2px at 40px 70px, rgba(255,255,255,0.8), transparent),
        radial-gradient(1px 1px at 90px 40px, white, transparent),
        radial-gradient(2px 2px at 160px 120px, rgba(255,215,0,0.9), transparent),
        radial-gradient(1px 1px at 230px 80px, white, transparent),
        radial-gradient(2px 2px at 300px 150px, rgba(255,255,255,0.7), transparent),
        radial-gradient(1px 1px at 350px 200px, white, transparent),
        radial-gradient(2px 2px at 420px 60px, rgba(255,215,0,0.8), transparent),
        radial-gradient(1px 1px at 480px 180px, white, transparent),
        radial-gradient(2px 2px at 520px 100px, rgba(255,255,255,0.9), transparent),
        radial-gradient(1px 1px at 100px 250px, white, transparent),
        radial-gradient(2px 2px at 200px 300px, rgba(255,215,0,0.7), transparent),
        radial-gradient(1px 1px at 450px 280px, white, transparent),
        radial-gradient(2px 2px at 550px 320px, rgba(255,255,255,0.8), transparent),
        radial-gradient(1px 1px at 80px 400px, white, transparent),
        radial-gradient(2px 2px at 180px 450px, rgba(255,215,0,0.6), transparent),
        radial-gradient(1px 1px at 380px 420px, white, transparent),
        radial-gradient(2px 2px at 500px 480px, rgba(255,255,255,0.7), transparent);
      opacity: 0.6;
    }
    
    /* Central spark/triangle geometry */
    .sacred-geometry {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 320px;
      height: 320px;
    }
    
    /* Outer glow ring */
    .outer-ring {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 300px;
      height: 300px;
      border: 1px solid rgba(255, 215, 0, 0.3);
      border-radius: 50%;
      box-shadow: 
        0 0 40px rgba(255, 215, 0, 0.2),
        inset 0 0 40px rgba(255, 215, 0, 0.1);
    }
    
    .inner-ring {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 240px;
      height: 240px;
      border: 1px solid rgba(0, 206, 209, 0.4);
      border-radius: 50%;
    }
    
    /* The Triangle */
    .triangle {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 0;
      height: 0;
      border-left: 90px solid transparent;
      border-right: 90px solid transparent;
      border-bottom: 156px solid rgba(255, 215, 0, 0.15);
      filter: drop-shadow(0 0 20px rgba(255, 215, 0, 0.4));
    }
    
    .triangle-outline {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -48%);
      width: 180px;
      height: 156px;
    }
    
    .triangle-outline svg {
      width: 100%;
      height: 100%;
    }
    
    /* Central Spark Dot */
    .spark-dot {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -30%);
      width: 20px;
      height: 20px;
      background: radial-gradient(circle, #FFD700 0%, #FFA500 50%, transparent 70%);
      border-radius: 50%;
      box-shadow: 
        0 0 30px #FFD700,
        0 0 60px #FFD700,
        0 0 90px rgba(255, 215, 0, 0.5);
      animation: pulse 3s ease-in-out infinite;
    }
    
    @keyframes pulse {
      0%, 100% { 
        box-shadow: 
          0 0 30px #FFD700,
          0 0 60px #FFD700,
          0 0 90px rgba(255, 215, 0, 0.5);
        transform: translate(-50%, -30%) scale(1);
      }
      50% { 
        box-shadow: 
          0 0 40px #FFD700,
          0 0 80px #FFD700,
          0 0 120px rgba(255, 215, 0, 0.7);
        transform: translate(-50%, -30%) scale(1.1);
      }
    }
    
    /* Ripple waves */
    .ripple {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -30%);
      border: 1px solid rgba(255, 215, 0, 0.3);
      border-radius: 50%;
      animation: ripple-expand 4s ease-out infinite;
    }
    
    .ripple:nth-child(1) { animation-delay: 0s; }
    .ripple:nth-child(2) { animation-delay: 1s; }
    .ripple:nth-child(3) { animation-delay: 2s; }
    .ripple:nth-child(4) { animation-delay: 3s; }
    
    @keyframes ripple-expand {
      0% {
        width: 20px;
        height: 20px;
        opacity: 0.8;
      }
      100% {
        width: 200px;
        height: 200px;
        opacity: 0;
      }
    }
    
    /* Infinity symbol */
    .infinity {
      position: absolute;
      top: 65%;
      left: 50%;
      transform: translate(-50%, 0);
      font-size: 48px;
      color: rgba(0, 206, 209, 0.5);
      text-shadow: 0 0 20px rgba(0, 206, 209, 0.5);
    }
    
    /* Title */
    .title-container {
      position: absolute;
      top: 100px;
      left: 0;
      right: 0;
      text-align: center;
    }
    
    .title-the {
      font-size: 24px;
      letter-spacing: 12px;
      color: rgba(255, 215, 0, 0.8);
      text-transform: uppercase;
      margin-bottom: 5px;
    }
    
    .title-main {
      font-size: 56px;
      font-weight: bold;
      letter-spacing: 6px;
      color: #fff;
      text-transform: uppercase;
      text-shadow: 
        0 0 30px rgba(255, 215, 0, 0.5),
        0 2px 4px rgba(0,0,0,0.5);
    }
    
    .title-spark {
      color: #FFD700;
      text-shadow: 
        0 0 40px rgba(255, 215, 0, 0.8),
        0 0 80px rgba(255, 215, 0, 0.4);
    }
    
    /* Subtitle */
    .subtitle {
      position: absolute;
      top: 220px;
      left: 0;
      right: 0;
      text-align: center;
      font-size: 18px;
      font-style: italic;
      letter-spacing: 4px;
      color: rgba(192, 192, 192, 0.8);
    }
    
    /* Volume */
    .volume {
      position: absolute;
      bottom: 180px;
      left: 0;
      right: 0;
      text-align: center;
      font-size: 16px;
      letter-spacing: 8px;
      color: rgba(107, 63, 160, 0.9);
      text-transform: uppercase;
    }
    
    /* Author */
    .author {
      position: absolute;
      bottom: 100px;
      left: 0;
      right: 0;
      text-align: center;
    }
    
    .author-name {
      font-size: 28px;
      letter-spacing: 8px;
      color: #fff;
      text-transform: uppercase;
    }
    
    /* Website */
    .website {
      position: absolute;
      bottom: 50px;
      left: 0;
      right: 0;
      text-align: center;
      font-size: 14px;
      letter-spacing: 3px;
      color: rgba(107, 63, 160, 0.8);
    }
    
    /* Decorative lines */
    .line-top, .line-bottom {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      width: 100px;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255,215,0,0.5), transparent);
    }
    
    .line-top { top: 260px; }
    .line-bottom { bottom: 220px; }
    
    /* Corner accents */
    .corner {
      position: absolute;
      width: 40px;
      height: 40px;
      border: 1px solid rgba(255, 215, 0, 0.3);
    }
    
    .corner-tl { top: 30px; left: 30px; border-right: none; border-bottom: none; }
    .corner-tr { top: 30px; right: 30px; border-left: none; border-bottom: none; }
    .corner-bl { bottom: 30px; left: 30px; border-right: none; border-top: none; }
    .corner-br { bottom: 30px; right: 30px; border-left: none; border-top: none; }
  </style>
</head>

  </div>
