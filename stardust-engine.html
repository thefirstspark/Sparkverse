<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stardust Rendering Engine — Sparkverse</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root {
  --void: #050508;
  --gold: #e8c87a;
  --cyan: #22d3d3;
  --violet: #8b5cf6;
  --rose: #ec4899;
  --green: #84cc16;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: var(--void);
  color: #e8e6e3;
  font-family: 'Space Mono', monospace;
  overflow: hidden;
  height: 100vh;
  cursor: crosshair;
}
#c {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
}
.hud {
  position: fixed;
  z-index: 20;
  pointer-events: none;
}
.hud * { pointer-events: auto; }
.top-bar {
  top: 0; left: 0; right: 0;
  padding: 1.25rem 1.5rem;
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: linear-gradient(to bottom, rgba(5,5,8,.92), transparent);
}
.logo {
  font-family: 'Orbitron', sans-serif;
  font-weight: 700;
  font-size: .85rem;
  letter-spacing: .25em;
  background: linear-gradient(135deg, var(--gold), var(--rose), var(--violet), var(--cyan));
  background-size: 200% 200%;
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  animation: shift 6s ease infinite;
}
@keyframes shift {
  0%, 100% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
}
.back {
  font-size: .65rem;
  letter-spacing: .15em;
  color: rgba(232,200,122,.6);
  text-decoration: none;
  border: 1px solid rgba(232,200,122,.25);
  padding: .35rem .8rem;
  border-radius: 999px;
  transition: all .2s;
}
.back:hover {
  color: var(--gold);
  border-color: var(--gold);
  box-shadow: 0 0 16px rgba(232,200,122,.2);
}
.panel {
  position: fixed;
  bottom: 1.5rem;
  left: 50%;
  transform: translateX(-50%);
  z-index: 20;
  background: rgba(8,8,14,.85);
  border: 1px solid rgba(255,255,255,.08);
  border-radius: 1.25rem;
  padding: 1rem 1.25rem;
  backdrop-filter: blur(16px);
  display: flex;
  flex-wrap: wrap;
  gap: .75rem 1.25rem;
  align-items: center;
  max-width: min(920px, 94vw);
  box-shadow: 0 0 40px rgba(0,0,0,.5);
}
.ctrl {
  display: flex;
  flex-direction: column;
  gap: .3rem;
  min-width: 110px;
}
.ctrl label {
  font-family: 'Orbitron', sans-serif;
  font-size: .55rem;
  letter-spacing: .18em;
  color: rgba(255,255,255,.45);
}
.ctrl input[type=range] {
  width: 120px;
  accent-color: var(--gold);
  cursor: pointer;
}
.modes {
  display: flex;
  gap: .4rem;
  flex-wrap: wrap;
}
.mode-btn {
  font-family: 'Orbitron', sans-serif;
  font-size: .55rem;
  letter-spacing: .12em;
  padding: .4rem .7rem;
  border-radius: 999px;
  border: 1px solid rgba(255,255,255,.12);
  background: rgba(255,255,255,.03);
  color: rgba(255,255,255,.7);
  cursor: pointer;
  transition: all .2s;
}
.mode-btn:hover, .mode-btn.active {
  border-color: var(--gold);
  color: var(--gold);
  background: rgba(232,200,122,.1);
  box-shadow: 0 0 12px rgba(232,200,122,.2);
}
.action-btn {
  font-family: 'Orbitron', sans-serif;
  font-size: .6rem;
  letter-spacing: .15em;
  padding: .5rem 1rem;
  border-radius: .6rem;
  border: none;
  background: linear-gradient(135deg, var(--gold), var(--rose));
  color: #050508;
  font-weight: 700;
  cursor: pointer;
  transition: transform .2s, box-shadow .2s;
}
.action-btn:hover {
  transform: translateY(-2px);
  box-shadow: 0 6px 20px rgba(232,200,122,.35);
}
.status {
  position: fixed;
  top: 4.5rem;
  left: 50%;
  transform: translateX(-50%);
  z-index: 15;
  font-size: .7rem;
  letter-spacing: .2em;
  color: rgba(34,211,211,.55);
  text-align: center;
  pointer-events: none;
}
.hint {
  position: fixed;
  bottom: 6.5rem;
  left: 50%;
  transform: translateX(-50%);
  z-index: 15;
  font-size: .6rem;
  letter-spacing: .15em;
  color: rgba(255,255,255,.25);
  pointer-events: none;
}
@media (max-width: 640px) {
  .panel { bottom: .75rem; padding: .75rem; gap: .5rem; }
  .ctrl { min-width: 90px; }
  .ctrl input[type=range] { width: 90px; }
  .hint { display: none; }
}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div class="hud top-bar">
  <div class="logo">STARDUST ENGINE</div>
  <a href="index.html" class="back">← GALAXY</a>
</div>

<div class="status" id="status">RENDER ONLINE · MOVE TO STIR</div>
<div class="hint">CLICK / HOLD TO EMIT · SPACE TO BURST</div>

<div class="panel">
  <div class="ctrl">
    <label>DENSITY</label>
    <input type="range" id="density" min="40" max="400" value="180">
  </div>
  <div class="ctrl">
    <label>TRAIL</label>
    <input type="range" id="trail" min="0" max="95" value="78">
  </div>
  <div class="ctrl">
    <label>FORCE</label>
    <input type="range" id="force" min="1" max="40" value="14">
  </div>
  <div class="modes" id="modes">
    <button class="mode-btn active" data-mode="cosmos">COSMOS</button>
    <button class="mode-btn" data-mode="gold">GOLD</button>
    <button class="mode-btn" data-mode="plasma">PLASMA</button>
    <button class="mode-btn" data-mode="void">VOID</button>
  </div>
  <button class="action-btn" id="burst">BURST</button>
  <button class="action-btn" id="clear" style="background:transparent;border:1px solid rgba(255,255,255,.2);color:#ccc">CLEAR</button>
</div>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H, particles = [], mouse = { x: -9999, y: -9999, down: false };
let mode = 'cosmos';
let density = 180, trail = 0.78, force = 14;

const PALETTES = {
  cosmos: ['#e8c87a', '#22d3d3', '#8b5cf6', '#ec4899', '#a8c0ff'],
  gold: ['#fbbf24', '#f59e0b', '#e8c87a', '#fff7ed', '#f97316'],
  plasma: ['#ec4899', '#8b5cf6', '#22d3d3', '#06b6d4', '#f472b6'],
  void: ['#9ca3af', '#6b7280', '#e5e7eb', '#4b5563', '#d1d5db']
};

function resize() {
  W = canvas.width = innerWidth;
  H = canvas.height = innerHeight;
}
resize();
addEventListener('resize', resize);

function spawn(n = 1, x, y) {
  const colors = PALETTES[mode];
  for (let i = 0; i < n; i++) {
    particles.push({
      x: x ?? Math.random() * W,
      y: y ?? Math.random() * H,
      vx: (Math.random() - 0.5) * 0.8,
      vy: (Math.random() - 0.5) * 0.8,
      r: Math.random() * 2.2 + 0.3,
      c: colors[Math.floor(Math.random() * colors.length)],
      a: Math.random() * 0.6 + 0.25,
      life: 1
    });
  }
}

function reseed() {
  particles = [];
  spawn(density);
}
reseed();

addEventListener('mousemove', e => {
  mouse.x = e.clientX;
  mouse.y = e.clientY;
  if (mouse.down) spawn(3, mouse.x, mouse.y);
});
addEventListener('mousedown', () => { mouse.down = true; });
addEventListener('mouseup', () => { mouse.down = false; });
addEventListener('mouseleave', () => { mouse.x = -9999; mouse.y = -9999; mouse.down = false; });
addEventListener('touchmove', e => {
  const t = e.touches[0];
  mouse.x = t.clientX;
  mouse.y = t.clientY;
  spawn(4, mouse.x, mouse.y);
}, { passive: true });
addEventListener('touchstart', e => {
  const t = e.touches[0];
  mouse.x = t.clientX;
  mouse.y = t.clientY;
  spawn(12, mouse.x, mouse.y);
}, { passive: true });

addEventListener('keydown', e => {
  if (e.code === 'Space') {
    e.preventDefault();
    burst();
  }
});

function burst() {
  const colors = PALETTES[mode];
  const cx = mouse.x > 0 ? mouse.x : W / 2;
  const cy = mouse.y > 0 ? mouse.y : H / 2;
  for (let i = 0; i < 80; i++) {
    const ang = Math.random() * Math.PI * 2;
    const sp = Math.random() * 6 + 2;
    particles.push({
      x: cx,
      y: cy,
      vx: Math.cos(ang) * sp,
      vy: Math.sin(ang) * sp,
      r: Math.random() * 2.5 + 0.5,
      c: colors[Math.floor(Math.random() * colors.length)],
      a: 0.9,
      life: 1
    });
  }
  document.getElementById('status').textContent = 'BURST RENDERED';
  setTimeout(() => {
    document.getElementById('status').textContent = 'RENDER ONLINE · MOVE TO STIR';
  }, 1200);
}

document.getElementById('burst').onclick = burst;
document.getElementById('clear').onclick = () => { particles = []; spawn(Math.floor(density * 0.3)); };
document.getElementById('density').oninput = e => {
  density = +e.target.value;
  if (particles.length < density) spawn(density - particles.length);
  else if (particles.length > density * 1.3) particles.length = density;
};
document.getElementById('trail').oninput = e => { trail = +e.target.value / 100; };
document.getElementById('force').oninput = e => { force = +e.target.value; };

document.querySelectorAll('.mode-btn').forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    mode = btn.dataset.mode;
    const colors = PALETTES[mode];
    particles.forEach(p => { p.c = colors[Math.floor(Math.random() * colors.length)]; });
  };
});

function tick() {
  ctx.fillStyle = `rgba(5,5,8,${1 - trail})`;
  ctx.fillRect(0, 0, W, H);

  const f = force * 0.0015;
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    const dx = mouse.x - p.x;
    const dy = mouse.y - p.y;
    const d = Math.sqrt(dx * dx + dy * dy) || 1;
    if (d < 220) {
      p.vx += (dx / d) * f * (220 - d);
      p.vy += (dy / d) * f * (220 - d);
      // soft orbit
      p.vx += (-dy / d) * f * 8;
      p.vy += (dx / d) * f * 8;
    }
    p.vx *= 0.985;
    p.vy *= 0.985;
    p.x += p.vx;
    p.y += p.vy;

    if (p.x < 0) p.x = W;
    if (p.x > W) p.x = 0;
    if (p.y < 0) p.y = H;
    if (p.y > H) p.y = 0;

    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    ctx.fillStyle = p.c;
    ctx.globalAlpha = p.a;
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  // soft glow cursor
  if (mouse.x > 0) {
    const g = ctx.createRadialGradient(mouse.x, mouse.y, 0, mouse.x, mouse.y, 80);
    g.addColorStop(0, 'rgba(232,200,122,0.12)');
    g.addColorStop(1, 'transparent');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(mouse.x, mouse.y, 80, 0, Math.PI * 2);
    ctx.fill();
  }

  requestAnimationFrame(tick);
}
tick();
</script>
</body>
</html>
