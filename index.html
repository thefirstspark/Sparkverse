<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SPARKVERSE | The First Spark</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--void:#050508;--nebula-purple:#8b5cf6;--spark-gold:#fbbf24;--cosmic-cyan:#22d3d3;--blood-orange:#f97316;--hot-pink:#ec4899;--ghost-white:rgba(255,255,255,.9);--dim:rgba(255,255,255,.4)}
body{background:var(--void);min-height:100vh;font-family:'Space Mono',monospace;color:var(--ghost-white);overflow-x:hidden;cursor:crosshair}
.gradient-text{background:linear-gradient(135deg,var(--hot-pink),var(--nebula-purple),var(--cosmic-cyan),#84cc16,var(--spark-gold),var(--blood-orange),var(--hot-pink));background-size:300% 300%;-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;animation:gs 8s ease infinite}
@keyframes gs{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
.cosmic-bg{position:fixed;inset:0;z-index:0;overflow:hidden}
.deep-space{position:absolute;inset:0;background:radial-gradient(ellipse at 10% 20%,rgba(139,92,246,.15),transparent 50%),radial-gradient(ellipse at 90% 80%,rgba(236,72,153,.12),transparent 45%),linear-gradient(180deg,#050508,#0a0a12 50%,#050510)}
.header{position:fixed;top:0;left:0;right:0;z-index:100;padding:1.5rem 2rem;display:flex;justify-content:space-between;align-items:center;background:linear-gradient(to bottom,rgba(5,5,8,.98),transparent)}
.logo{font-family:Orbitron,sans-serif;font-weight:900;font-size:1.5rem;letter-spacing:.2em}
.galaxy-container{position:relative;z-index:10;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:6rem 2rem 2rem}
.galaxy-title{text-align:center;margin-bottom:1rem}
.galaxy-title h1{font-family:Orbitron,sans-serif;font-size:clamp(2.5rem,10vw,5rem);font-weight:900;letter-spacing:.35em;margin-bottom:.5rem;text-shadow:0 0 30px rgba(139,92,246,.5)}
.galaxy-subtitle{font-size:.95rem;letter-spacing:.35em;text-transform:uppercase;background:linear-gradient(90deg,var(--cosmic-cyan),var(--nebula-purple),var(--hot-pink));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.solar-system{position:relative;width:min(900px,90vw);height:min(900px,90vw);margin:2rem auto}
.orbit{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);border-radius:50%;pointer-events:none}
.orbit-1{width:280px;height:280px;border:1px solid rgba(139,92,246,.2)}
.orbit-2{width:440px;height:440px;border:1px solid rgba(236,72,153,.15)}
.orbit-3{width:600px;height:600px;border:1px solid rgba(34,211,211,.12)}
.orbit-4{width:760px;height:760px;border:1px solid rgba(251,191,36,.1)}
.sun{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:130px;height:130px;background:radial-gradient(circle at 30% 30%,#fff,var(--spark-gold),var(--blood-orange),var(--hot-pink),#7c2d12);border-radius:50%;cursor:pointer;z-index:20;display:flex;align-items:center;justify-content:center;animation:sunPulse 4s ease-in-out infinite;transition:transform .3s}
@keyframes sunPulse{0%,100%{box-shadow:0 0 60px var(--spark-gold),0 0 120px rgba(251,191,36,.5)}50%{box-shadow:0 0 80px var(--spark-gold),0 0 160px rgba(251,191,36,.6)}}
.sun:hover{transform:translate(-50%,-50%) scale(1.12)}
.sun-label{font-family:Orbitron,sans-serif;font-size:.7rem;font-weight:700;color:var(--void);text-align:center;letter-spacing:.1em}
.planet{position:absolute;border-radius:50%;cursor:pointer;transition:transform .3s;z-index:15}
.planet:hover{transform:scale(1.22);z-index:25}
.planet-body{width:100%;height:100%;border-radius:50%;position:absolute;top:0;left:0}
.planet-info{position:absolute;bottom:-38px;left:50%;transform:translateX(-50%);text-align:center;white-space:nowrap;opacity:0;transition:opacity .3s}
.planet:hover .planet-info{opacity:1}
.planet-name{font-family:Orbitron,sans-serif;font-size:.72rem;font-weight:700;letter-spacing:.12em}
.planet-lumina{width:55px;height:55px;top:calc(50% - 167px);left:calc(50% - 27px)}
.planet-lumina .planet-body{background:radial-gradient(circle at 25% 25%,#fff,var(--cosmic-cyan),#0d9488);box-shadow:0 0 30px var(--cosmic-cyan)}
.planet-lumina .planet-name{color:var(--cosmic-cyan)}
.planet-nexus{width:70px;height:70px;top:calc(50% + 180px);left:calc(50% - 130px)}
.planet-nexus .planet-body{background:radial-gradient(circle at 25% 25%,#e9d5ff,var(--nebula-purple),#6d28d9);box-shadow:0 0 40px var(--nebula-purple)}
.planet-nexus .planet-name{color:var(--nebula-purple)}
.planet-void{width:60px;height:60px;top:calc(50% - 90px);left:calc(50% + 270px)}
.planet-void .planet-body{background:radial-gradient(circle at 25% 25%,#374151,#111827,#000);box-shadow:0 0 30px rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.1)}
.planet-void .planet-name{color:#9ca3af}
.planet-forge{width:75px;height:75px;top:calc(50% + 40px);left:calc(50% - 340px)}
.planet-forge .planet-body{background:radial-gradient(circle at 25% 25%,#fef3c7,var(--spark-gold),var(--blood-orange));box-shadow:0 0 50px var(--blood-orange)}
.planet-forge .planet-name{color:var(--blood-orange)}
.planet-archive{width:48px;height:48px;top:calc(50% - 260px);left:calc(50% - 180px)}
.planet-archive .planet-body{background:radial-gradient(circle at 25% 25%,#f3f4f6,#9ca3af,#4b5563);box-shadow:0 0 25px rgba(156,163,175,.5)}
.planet-archive .planet-name{color:#d1d5db}
.planet-echo{width:45px;height:45px;top:calc(50% + 310px);left:calc(50% + 120px)}
.planet-echo .planet-body{background:radial-gradient(circle at 25% 25%,#a5f3fc,#06b6d4,#0891b2);box-shadow:0 0 30px rgba(6,182,212,.6)}
.planet-echo .planet-name{color:#22d3ee}
.planet-genesis{width:52px;height:52px;top:calc(50% + 100px);left:calc(50% + 250px)}
.planet-genesis .planet-body{background:radial-gradient(circle at 25% 25%,#fce7f3,var(--hot-pink),#be185d);box-shadow:0 0 35px var(--hot-pink)}
.planet-genesis .planet-name{color:var(--hot-pink)}
.planet-modal{position:fixed;inset:0;background:rgba(5,5,8,.97);z-index:1000;display:none;align-items:center;justify-content:center;padding:2rem;opacity:0;transition:opacity .3s;backdrop-filter:blur(10px)}
.planet-modal.active{display:flex;opacity:1}
.modal-content{max-width:560px;width:100%;background:linear-gradient(135deg,rgba(20,20,30,.95),rgba(30,30,45,.95));border:1px solid rgba(139,92,246,.3);border-radius:1.5rem;padding:2.5rem;position:relative;transform:scale(.92);transition:transform .3s;box-shadow:0 0 60px rgba(139,92,246,.2)}
.planet-modal.active .modal-content{transform:scale(1)}
.modal-close{position:absolute;top:1.25rem;right:1.25rem;background:none;border:none;color:var(--dim);font-size:1.5rem;cursor:pointer}
.modal-close:hover{color:var(--hot-pink)}
.modal-header{display:flex;align-items:center;gap:1.5rem;margin-bottom:1.25rem}
.modal-planet-icon{width:80px;height:80px;border-radius:50%;flex-shrink:0}
.modal-title{font-family:Orbitron,sans-serif;font-size:1.5rem;font-weight:700;letter-spacing:.12em;margin-bottom:.35rem}
.modal-subtitle{font-size:.85rem;color:var(--cosmic-cyan)}
.modal-description{color:var(--dim);line-height:1.75;margin-bottom:1.5rem;font-size:.92rem}
.modal-actions{display:flex;gap:1rem}
.btn{flex:1;padding:.85rem 1.4rem;border-radius:.75rem;font-family:Orbitron,sans-serif;font-size:.75rem;font-weight:700;letter-spacing:.15em;cursor:pointer;text-transform:uppercase;transition:all .2s}
.btn-primary{background:linear-gradient(135deg,var(--spark-gold),var(--blood-orange),var(--hot-pink));border:none;color:var(--void)}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(251,191,36,.35)}
.btn-secondary{background:transparent;border:1px solid rgba(255,255,255,.2);color:var(--ghost-white)}
.btn-secondary:hover{border-color:var(--cosmic-cyan);color:var(--cosmic-cyan)}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;z-index:100;padding:1rem 2rem 1.4rem;display:flex;justify-content:center;gap:2.5rem;background:linear-gradient(to top,rgba(5,5,8,.98),transparent)}
.nav-item{display:flex;flex-direction:column;align-items:center;gap:.35rem;color:var(--dim);text-decoration:none;font-size:.6rem;letter-spacing:.12em;text-transform:uppercase}
.nav-item.active,.nav-item:hover{color:var(--ghost-white)}
.nav-icon{font-size:1.3rem}
@media(max-width:768px){.solar-system{width:100vw;height:100vw}.orbit-1{width:180px;height:180px}.orbit-2{width:280px;height:280px}.orbit-3{width:380px;height:380px}.orbit-4{width:480px;height:480px}.sun{width:90px;height:90px}.planet-lumina{width:38px;height:38px;top:calc(50% - 109px)}.planet-nexus{width:48px;height:48px;top:calc(50% + 110px);left:calc(50% - 80px)}.planet-void{width:42px;height:42px;top:calc(50% - 55px);left:calc(50% + 160px)}.planet-forge{width:52px;height:52px;top:calc(50% + 25px);left:calc(50% - 200px)}.planet-archive{width:34px;height:34px;top:calc(50% - 155px);left:calc(50% - 110px)}.planet-echo{width:30px;height:30px;top:calc(50% + 190px);left:calc(50% + 70px)}.planet-genesis{width:36px;height:36px;top:calc(50% + 60px);left:calc(50% + 150px)}.header{padding:1rem}.logo{font-size:1.1rem}.galaxy-title h1{letter-spacing:.2em}.bottom-nav{gap:1.5rem}}
</style>
</head>
<body>
<div class="cosmic-bg"><div class="deep-space"></div></div>
<header class="header"><div class="logo gradient-text">SPARKVERSE</div></header>
<main class="galaxy-container">
  <div class="galaxy-title">
    <h1 class="gradient-text">SPARKVERSE</h1>
    <p class="galaxy-subtitle">Navigate the Cosmos of Consciousness</p>
  </div>
  <div class="solar-system">
    <div class="orbit orbit-1"></div><div class="orbit orbit-2"></div><div class="orbit orbit-3"></div><div class="orbit orbit-4"></div>
    <div class="sun" onclick="openModal('core')"><span class="sun-label">CORE<br>SPARK</span></div>
    <div class="planet planet-lumina" onclick="openModal('lumina')"><div class="planet-body"></div><div class="planet-info"><div class="planet-name">LUMINA</div></div></div>
    <div class="planet planet-nexus" onclick="openModal('nexus')"><div class="planet-body"></div><div class="planet-info"><div class="planet-name">NEXUS</div></div></div>
    <div class="planet planet-void" onclick="openModal('void')"><div class="planet-body"></div><div class="planet-info"><div class="planet-name">VOID STATION</div></div></div>
    <div class="planet planet-forge" onclick="openModal('forge')"><div class="planet-body"></div><div class="planet-info"><div class="planet-name">THE FORGE</div></div></div>
    <div class="planet planet-archive" onclick="openModal('archive')"><div class="planet-body"></div><div class="planet-info"><div class="planet-name">DNA CHAMBER</div></div></div>
    <div class="planet planet-echo" onclick="openModal('echo')"><div class="planet-body"></div><div class="planet-info"><div class="planet-name">ECHO CHAMBER</div></div></div>
    <div class="planet planet-genesis" onclick="openModal('genesis')"><div class="planet-body"></div><div class="planet-info"><div class="planet-name">GENESIS</div></div></div>
  </div>
</main>
<nav class="bottom-nav">
  <a href="#" class="nav-item active"><span class="nav-icon">◉</span><span>Galaxy</span></a>
  <a href="#" class="nav-item"><span class="nav-icon">◆</span><span>Wallet</span></a>
  <a href="#" class="nav-item"><span class="nav-icon">☰</span><span>Inventory</span></a>
  <a href="#" class="nav-item"><span class="nav-icon">◈</span><span>Profile</span></a>
</nav>
<div class="planet-modal" id="planetModal">
  <div class="modal-content">
    <button class="modal-close" onclick="closeModal()">✕</button>
    <div class="modal-header">
      <div class="modal-planet-icon" id="modalIcon"></div>
      <div>
        <h3 class="modal-title gradient-text" id="modalTitle">Planet</h3>
        <p class="modal-subtitle" id="modalSubtitle"></p>
      </div>
    </div>
    <p class="modal-description" id="modalDescription"></p>
    <div class="modal-actions">
      <button class="btn btn-secondary" onclick="closeModal()">ORBIT</button>
      <button class="btn btn-primary" id="modalAction">ENTER</button>
    </div>
  </div>
</div>
<script>
const planets={
  core:{name:'CORE SPARK',subtitle:'The Origin Point',icon:'radial-gradient(circle at 30% 30%,#fff,#fbbf24,#f97316,#ec4899,#7c2d12)',description:'The central hub of the Sparkverse. Your journey begins and returns here.',action:'ENTER CORE',url:'soul-map.html'},
  lumina:{name:'LUMINA',subtitle:'Beginner Consciousness',icon:'radial-gradient(circle at 25% 25%,#fff,#22d3d3,#0d9488,#064e3b)',description:'The gateway zone. Foundational teachings on consciousness and introductory tools.',action:'ENTER LUMINA',url:'free.html'},
  nexus:{name:'NEXUS',subtitle:'Interactive Tools Hub',icon:'radial-gradient(circle at 25% 25%,#e9d5ff,#8b5cf6,#6d28d9,#4c1d95)',description:'The workshop of consciousness. Soul mapping, sigil creation, frequency alignment.',action:'ENTER NEXUS',url:'tools.html'},
  void:{name:'VOID STATION',subtitle:'Shadow Work & Deep Processing',icon:'radial-gradient(circle at 25% 25%,#374151,#111827,#000)',description:'Tools for shadow integration, trauma processing, and deep consciousness work.',action:'ENTER VOID',url:'void-portal.html'},
  forge:{name:'THE FORGE',subtitle:'Reality Creation Tools',icon:'radial-gradient(circle at 25% 25%,#fef3c7,#fbbf24,#f97316,#9a3412)',description:'Where consciousness becomes creation. Build your reality with intention tools.',action:'ENTER FORGE',url:'spark-protocol.html'},
  archive:{name:'DNA CHAMBER',subtitle:'The Lineage Layer',icon:'radial-gradient(circle at 25% 25%,#ff6b3d,#c94c2a,#7c2d12)',description:'Four living strands. Ancestral fire, selector choice, forge, orbit. What moves through us — and what stops here.',action:'ENTER DNA CHAMBER',url:'dna-chamber.html'},
  echo:{name:'ECHO CHAMBER',subtitle:'Community & Signal',icon:'radial-gradient(circle at 25% 25%,#a5f3fc,#06b6d4,#0891b2,#155e75)',description:'The signal zone. Share insights, complete challenges, connect with other Players.',action:'ENTER ECHO',url:'players.html'},
  genesis:{name:'GENESIS',subtitle:'Soul Artifacts',icon:'radial-gradient(circle at 25% 25%,#fce7f3,#ec4899,#be185d,#831843)',description:'Where soul maps become permanent artifacts. Your transformation has receipts.',action:'ENTER GENESIS',url:'genesis.html'}
};
function openModal(id){const p=planets[id];if(!p)return;document.getElementById('modalIcon').style.background=p.icon;document.getElementById('modalTitle').textContent=p.name;document.getElementById('modalSubtitle').textContent=p.subtitle;document.getElementById('modalDescription').textContent=p.description;document.getElementById('modalAction').textContent=p.action;document.getElementById('modalAction').onclick=()=>landOnPlanet(id);document.getElementById('planetModal').classList.add('active')}
function closeModal(){document.getElementById('planetModal').classList.remove('active')}
function landOnPlanet(id){const p=planets[id];if(p&&p.url)window.location.href=p.url}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
document.getElementById('planetModal').addEventListener('click',e=>{if(e.target.id==='planetModal')closeModal()});
</script>
</body>
</html>
